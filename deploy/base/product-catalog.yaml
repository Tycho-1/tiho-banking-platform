apiVersion: v1
kind: Service
metadata:
  labels:
    application: bank-of-anthos
    environment: development
    team: products
    tier: backend
  name: product-catalog
spec:
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  selector:
    app: product-catalog
    application: bank-of-anthos
    environment: development
    team: products
    tier: backend
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    application: bank-of-anthos
    environment: development
    team: products
    tier: backend
  name: product-catalog
spec:
  selector:
    matchLabels:
      app: product-catalog
      application: bank-of-anthos
      environment: development
      team: products
      tier: backend
  template:
    metadata:
      annotations:
        proxy.istio.io/config: '{ "holdApplicationUntilProxyStarts": true }'
      labels:
        app: product-catalog
        application: bank-of-anthos
        environment: development
        team: products
        tier: backend
    spec:
      containers:
        - env:
            - name: VERSION
              value: v0.1.0
            - name: PORT
              value: "8080"
            - name: ENABLE_TRACING
              value: "true"
            - name: ENABLE_METRICS
              value: "true"
            - name: LOG_LEVEL
              value: info
            - name: PRODUCTS_DATA_PATH
              value: /data/products.json
          envFrom:
            - configMapRef:
                name: environment-config
          image: ghcr.io/tycho-1/tiho-banking-platform/product-catalog:v0.1.0
          name: product-catalog
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
          resources:
            limits:
              cpu: 250m
              ephemeral-storage: 0.25Gi
              memory: 128Mi
            requests:
              cpu: 100m
              ephemeral-storage: 0.25Gi
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - all
            privileged: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /tmp
              name: tmp
            - mountPath: /tmp/.ssh
              name: publickey
              readOnly: true
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      serviceAccountName: bank-of-anthos
      terminationGracePeriodSeconds: 5
      volumes:
        - emptyDir: {}
          name: tmp
        - name: publickey
          secret:
            items:
              - key: jwtRS256.key.pub
                path: publickey
            secretName: jwt-key
