# Keep VERSION in sync with contacts newTag in this component (Kustomize
# images: does not rewrite env). Base stays v0.6.9 for upstream/gke-dev.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: contacts
spec:
  template:
    spec:
      containers:
        - name: contacts
          env:
            - name: VERSION
              value: v0.6.10
