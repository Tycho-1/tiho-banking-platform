# Keep VERSION in sync with ledgerwriter newTag in this component (Kustomize
# images: does not rewrite env). Base stays v0.6.9 for upstream/gke-dev.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledgerwriter
spec:
  template:
    spec:
      containers:
        - name: ledgerwriter
          env:
            - name: VERSION
              value: v0.6.10
