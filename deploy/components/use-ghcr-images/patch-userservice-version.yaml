# Keep VERSION in sync with userservice newTag in this component (Kustomize
# images: does not rewrite env). Base stays v0.6.9 for upstream/gke-dev.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: userservice
spec:
  template:
    spec:
      containers:
        - name: userservice
          env:
            - name: VERSION
              value: v0.6.11
