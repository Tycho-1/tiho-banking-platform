# Remap Bank of Anthos upstream images → this repo’s GHCR images (CI publish).
# Opt in from any overlay:
#
#   components:
#     - ../../components/use-ghcr-images
#
# Prerequisites: ENABLE_IMAGE_PUSH=true so CI pushed images; Kind/GKE can pull from ghcr.io
# (public package, or imagePullSecret for private).
#
# Each service has its own semver in src/<service>/release.yaml. Pin newTag per image independently.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# GHCR requires lowercase. Matches:
#   ghcr.io/${{ github.repository }}/<service>  with repository tycho-1/tiho-banking-platform
images:
  - name: us-central1-docker.pkg.dev/bank-of-anthos-ci/bank-of-anthos/frontend
    newName: ghcr.io/tycho-1/tiho-banking-platform/frontend
    newTag: v0.6.12
  - name: us-central1-docker.pkg.dev/bank-of-anthos-ci/bank-of-anthos/userservice
    newName: ghcr.io/tycho-1/tiho-banking-platform/userservice
    newTag: v0.6.9
  - name: us-central1-docker.pkg.dev/bank-of-anthos-ci/bank-of-anthos/contacts
    newName: ghcr.io/tycho-1/tiho-banking-platform/contacts
    newTag: v0.6.9
  - name: us-central1-docker.pkg.dev/bank-of-anthos-ci/bank-of-anthos/balancereader
    newName: ghcr.io/tycho-1/tiho-banking-platform/balancereader
    newTag: v0.6.12
  - name: us-central1-docker.pkg.dev/bank-of-anthos-ci/bank-of-anthos/ledgerwriter
    newName: ghcr.io/tycho-1/tiho-banking-platform/ledgerwriter
    newTag: v0.6.9
  - name: us-central1-docker.pkg.dev/bank-of-anthos-ci/bank-of-anthos/transactionhistory
    newName: ghcr.io/tycho-1/tiho-banking-platform/transactionhistory
    newTag: v0.6.9
  - name: us-central1-docker.pkg.dev/bank-of-anthos-ci/bank-of-anthos/accounts-db
    newName: ghcr.io/tycho-1/tiho-banking-platform/accounts-db
    newTag: v0.6.9
  - name: us-central1-docker.pkg.dev/bank-of-anthos-ci/bank-of-anthos/ledger-db
    newName: ghcr.io/tycho-1/tiho-banking-platform/ledger-db
    newTag: v0.6.9
  - name: us-central1-docker.pkg.dev/bank-of-anthos-ci/bank-of-anthos/loadgenerator
    newName: ghcr.io/tycho-1/tiho-banking-platform/loadgenerator
    newTag: v0.6.9
  - name: ghcr.io/tycho-1/tiho-banking-platform/product-catalog
    newTag: v0.1.2

patches:
  - path: patch-frontend-version.yaml
  - path: patch-balancereader-version.yaml

