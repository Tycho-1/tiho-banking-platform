# Syncs Vault → K8s Secret accounts-db-secrets (same keys Deployments already use).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: accounts-db-secrets
  namespace: banking-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-banking-platform
    kind: SecretStore
  target:
    name: accounts-db-secrets
    creationPolicy: Owner
  data:
    - secretKey: ACCOUNTS_DB_URI
      remoteRef:
        key: tiho-banking-platform/db/accounts
        property: ACCOUNTS_DB_URI
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: tiho-banking-platform/db/accounts
        property: POSTGRES_PASSWORD
