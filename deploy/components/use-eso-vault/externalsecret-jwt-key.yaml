# Syncs Vault → K8s Secret jwt-key (replaces deploy/components/demo-jwt when this component is on).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: jwt-key
  namespace: banking-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-banking-platform
    kind: SecretStore
  target:
    name: jwt-key
    creationPolicy: Owner
  data:
    - secretKey: jwtRS256.key
      remoteRef:
        key: tiho-banking-platform/auth/jwt
        property: jwtRS256.key
    - secretKey: jwtRS256.key.pub
      remoteRef:
        key: tiho-banking-platform/auth/jwt
        property: jwtRS256.key.pub
