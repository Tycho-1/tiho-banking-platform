# Syncs Vault → K8s Secret demo-data-secrets (frontend demo login password).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: demo-data-secrets
  namespace: banking-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-banking-platform
    kind: SecretStore
  target:
    name: demo-data-secrets
    creationPolicy: Owner
  data:
    - secretKey: DEMO_LOGIN_PASSWORD
      remoteRef:
        key: tiho-banking-platform/demo/login
        property: DEMO_LOGIN_PASSWORD
