# App-side CNPG connection material (ns banking-platform).
# With ESO, put CNPG hostnames in Vault db/accounts + db/ledger as well —
# do not rely on kustomize replacements from this Secret (see README).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cnpg-connection-secrets
  namespace: banking-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-banking-platform
    kind: SecretStore
  target:
    name: cnpg-connection-secrets
    creationPolicy: Owner
  data:
    - secretKey: ACCOUNTS_DB_URI
      remoteRef:
        key: tiho-banking-platform/cnpg/connection
        property: ACCOUNTS_DB_URI
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: tiho-banking-platform/cnpg/connection
        property: POSTGRES_PASSWORD
    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef:
        key: tiho-banking-platform/cnpg/connection
        property: SPRING_DATASOURCE_PASSWORD
    - secretKey: POSTGRES_PASSWORD_LEDGER
      remoteRef:
        key: tiho-banking-platform/cnpg/connection
        property: POSTGRES_PASSWORD_LEDGER
