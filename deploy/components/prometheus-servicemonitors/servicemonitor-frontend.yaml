# Scrape frontend /metrics via the existing Service (named port http).
#
# Label release: kube-prometheus-stack matches Prometheus
# serviceMonitorSelector (Helm default). Change it if the release name differs.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: frontend
  labels:
    application: bank-of-anthos
    environment: development
    team: frontend
    tier: web
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: frontend
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
