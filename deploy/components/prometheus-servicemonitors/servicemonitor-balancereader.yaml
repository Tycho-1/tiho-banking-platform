# Scrape balancereader Actuator Prometheus endpoint via the existing Service
# (named port http). Path is Spring's /actuator/prometheus, not Go /metrics.
#
# Label release: kube-prometheus-stack matches Prometheus
# serviceMonitorSelector (Helm default). Change it if the release name differs.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: balancereader
  labels:
    application: bank-of-anthos
    environment: development
    team: ledger
    tier: backend
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: balancereader
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
