# Scrape product-catalog /metrics via the existing Service (named port http).
# ServiceMonitor (not PodMonitor): there is already a ClusterIP Service; Prometheus
# Operator follows Endpoints. PodMonitor is for pods with no Service (e.g. CNPG).
#
# Label release: kube-prometheus-stack matches this Kind cluster's Prometheus
# serviceMonitorSelector. Change it if the Helm release name differs.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: product-catalog
  labels:
    application: bank-of-anthos
    environment: development
    team: products
    tier: backend
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: product-catalog
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
