# Idempotent demo seed — runs after CNPG is up. Safe if bootstrap already loaded data (ON CONFLICT DO NOTHING).
# Uses banking-accounts-credentials (our bootstrap secret), not banking-accounts-superuser (CNPG creates that later).
# Re-run: kubectl delete job banking-accounts-seed -n cnpg-banking && kubectl apply -k deploy/overlays/kind-local-ambient-cnpg
apiVersion: batch/v1
kind: Job
metadata:
  name: banking-accounts-seed
  namespace: cnpg-banking
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 12
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-postgres
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h banking-accounts-rw -p 5432; do
                echo "waiting for banking-accounts-rw..."
                sleep 3
              done
      containers:
        - name: seed
          image: postgres:16-alpine
          env:
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: banking-accounts-credentials
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: banking-accounts-credentials
                  key: password
          command:
            - sh
            - -c
            - |
              set -e
              psql -h banking-accounts-rw -U "${PGUSER}" -d accounts-db -v ON_ERROR_STOP=1 -f /sql/schema.sql
              psql -h banking-accounts-rw -U "${PGUSER}" -d accounts-db -v ON_ERROR_STOP=1 -f /sql/testdata.sql
          volumeMounts:
            - name: sql
              mountPath: /sql
              readOnly: true
      volumes:
        - name: sql
          configMap:
            name: banking-accounts-init-sql
