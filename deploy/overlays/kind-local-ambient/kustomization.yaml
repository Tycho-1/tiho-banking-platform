# Kind + Istio ambient (ztunnel). Sidecar overlay remains the default (kind-local).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Apply waypoint Gateway (from istio-ambient-mesh) into banking-platform,
# matching namespace label istio.io/use-waypoint=waypoint.
namespace: banking-platform

resources:
  - ../kind-local

components:
  - ../../components/istio-ambient-mesh
