# Istio ingress — matches default istioctl installs (IngressGateway in istio-system, listener 8080).
# Use this file instead of gateway-helm.yaml in kind-local/kustomization.yaml when needed.
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: banking-platform-gateway
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 8080
        name: http
        protocol: HTTP
      hosts:
        - "*"
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: banking-platform-frontend
spec:
  hosts:
    - "*"
  gateways:
    - banking-platform-gateway
  http:
    - route:
        - destination:
            host: frontend
            port:
              number: 80
