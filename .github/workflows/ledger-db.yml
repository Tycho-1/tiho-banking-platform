name: ledger-db

on:
  push:
    branches: [main]
    paths:
      - 'src/ledger/ledger-db/**'
      - '.github/workflows/ledger-db.yml'
  pull_request:
    paths:
      - 'src/ledger/ledger-db/**'
      - '.github/workflows/ledger-db.yml'

concurrency:
  group: ledger-db-${{ github.ref }}
  cancel-in-progress: true

env:
  SERVICE_NAME: ledger-db
  SERVICE_PATH: src/ledger/ledger-db
  IMAGE: ghcr.io/${{ github.repository }}/ledger-db

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker build
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.SERVICE_PATH }}
          push: false
          tags: ${{ env.SERVICE_NAME }}:ci

  publish:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_IMAGE_PUSH == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Read semver from release.yaml
        id: version
        working-directory: ${{ env.SERVICE_PATH }}
        run: |
          version=$(sed -n 's/^version:[[:space:]]*"\?\([^"#]*\)"\?.*/\1/p' release.yaml | tr -d '[:space:]')
          if [ -z "$version" ]; then
            echo "Missing or empty version in release.yaml" >&2
            exit 1
          fi
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ env.SERVICE_PATH }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.tag }}
            ${{ env.IMAGE }}:${{ github.sha }}
