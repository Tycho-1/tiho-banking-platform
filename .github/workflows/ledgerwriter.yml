name: ledgerwriter

on:
  push:
    branches: [main]
    paths:
      - 'src/ledger/ledgerwriter/**'
      - '.github/workflows/ledgerwriter.yml'
  pull_request:
    paths:
      - 'src/ledger/ledgerwriter/**'
      - '.github/workflows/ledgerwriter.yml'

concurrency:
  group: ledgerwriter-${{ github.ref }}
  cancel-in-progress: true

env:
  SERVICE_NAME: ledgerwriter
  SERVICE_PATH: src/ledger/ledgerwriter
  IMAGE: ghcr.io/${{ github.repository }}/ledgerwriter

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Test (Maven)
        run: mvn -B test
        working-directory: ${{ env.SERVICE_PATH }}

      - name: Container image (Jib → local Docker)
        # pom needs jib.to.image — Jib requires an explicit target image
        run: mvn -B compile jib:dockerBuild -Djib.to.image=${{ env.SERVICE_NAME }}:ci
        working-directory: ${{ env.SERVICE_PATH }}

  publish:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_IMAGE_PUSH == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image (Jib)
        run: mvn -B compile jib:build -Djib.to.image=${{ env.IMAGE }}:${{ github.sha }} -Djib.to.tags=latest
        working-directory: ${{ env.SERVICE_PATH }}
