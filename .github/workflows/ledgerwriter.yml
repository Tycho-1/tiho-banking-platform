name: ledgerwriter

on:
  push:
    branches: [main]
    paths:
      - 'src/ledger/ledgerwriter/**'
      - '!src/ledger/ledgerwriter/*.md'
      - '!src/ledger/ledgerwriter/**/*.md'
      - '.github/workflows/ledgerwriter.yml'
  pull_request:
    paths:
      - 'src/ledger/ledgerwriter/**'
      - '!src/ledger/ledgerwriter/*.md'
      - '!src/ledger/ledgerwriter/**/*.md'
      - '.github/workflows/ledgerwriter.yml'

  workflow_dispatch:

concurrency:
  group: ledgerwriter-${{ github.ref }}
  cancel-in-progress: true

env:
  SERVICE_NAME: ledgerwriter
  SERVICE_PATH: src/ledger/ledgerwriter

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Test (Maven)
        run: mvn -B test
        working-directory: ${{ env.SERVICE_PATH }}

      - name: Container image (Jib → local Docker)
        # pom needs jib.to.image — Jib requires an explicit target image
        run: mvn -B compile jib:dockerBuild -Djib.to.image=${{ env.SERVICE_NAME }}:ci
        working-directory: ${{ env.SERVICE_PATH }}

  publish:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_IMAGE_PUSH == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Image name (GHCR requires lowercase)
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/${{ env.SERVICE_NAME }}" >> "$GITHUB_ENV"

      - name: Read semver from release.yaml
        id: version
        working-directory: ${{ env.SERVICE_PATH }}
        run: |
          version=$(sed -n 's/^version:[[:space:]]*"\?\([^"#]*\)"\?.*/\1/p' release.yaml | tr -d '[:space:]')
          if [ -z "$version" ]; then
            echo "Missing or empty version in release.yaml" >&2
            exit 1
          fi
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image (Jib)
        run: >
          mvn -B compile jib:build
          -Djib.to.image=${{ env.IMAGE }}:${{ steps.version.outputs.tag }}
          -Djib.to.tags=${{ github.sha }}
        working-directory: ${{ env.SERVICE_PATH }}
