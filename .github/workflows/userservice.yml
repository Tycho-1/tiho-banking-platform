name: userservice

on:
  push:
    branches: [main]
    paths:
      - 'src/accounts/userservice/**'
      - '.github/workflows/userservice.yml'
      - '.github/actions/scan-image/**'
      - 'trivy.yaml'
  pull_request:
    paths:
      - 'src/accounts/userservice/**'
      - '.github/workflows/userservice.yml'
      - '.github/actions/scan-image/**'
      - 'trivy.yaml'

  workflow_dispatch:

concurrency:
  group: userservice-${{ github.ref }}
  cancel-in-progress: true

env:
  SERVICE_NAME: userservice
  SERVICE_PATH: src/accounts/userservice

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.14'

      - name: Test (pytest)
        run: |
          uv sync --group dev
          uv run pytest
        working-directory: ${{ env.SERVICE_PATH }}

      - name: Docker build
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.SERVICE_PATH }}
          push: false
          load: true
          tags: ${{ env.SERVICE_NAME }}:ci

      - uses: ./.github/actions/scan-image
        with:
          image-ref: ${{ env.SERVICE_NAME }}:ci
          category: trivy-${{ env.SERVICE_NAME }}

  publish:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_IMAGE_PUSH == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Image name (GHCR requires lowercase)
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/${{ env.SERVICE_NAME }}" >> "$GITHUB_ENV"

      - name: Read semver from release.yaml
        id: version
        working-directory: ${{ env.SERVICE_PATH }}
        run: |
          version=$(sed -n 's/^version:[[:space:]]*"\?\([^"#]*\)"\?.*/\1/p' release.yaml | tr -d '[:space:]')
          if [ -z "$version" ]; then
            echo "Missing or empty version in release.yaml" >&2
            exit 1
          fi
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: ${{ env.SERVICE_PATH }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.tag }}
            ${{ env.IMAGE }}:${{ github.sha }}
