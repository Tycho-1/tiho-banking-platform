# Validate all Kustomize overlays (no cluster required).
name: Deploy validate

on:
  push:
    branches: [main]
    paths:
      - 'deploy/**'
      - '.github/workflows/deploy-validate.yml'
  pull_request:
    paths:
      - 'deploy/**'
      - '.github/workflows/deploy-validate.yml'

  workflow_dispatch:

concurrency:
  group: deploy-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kustomize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install kubectl
        uses: azure/setup-kubectl@v5

      - name: Build overlays
        run: |
          set -euo pipefail
          for overlay in \
            deploy/overlays/kind-local \
            deploy/overlays/kind-local-eso \
            deploy/overlays/kind-local-gateway-api \
            deploy/overlays/kind-local-ambient \
            deploy/overlays/kind-local-ambient-cnpg \
            deploy/overlays/kind-local-ambient-cnpg-eso \
            deploy/overlays/gke-dev
          do
            echo "==> kustomize ${overlay}"
            kubectl kustomize "${overlay}" > /dev/null
          done
