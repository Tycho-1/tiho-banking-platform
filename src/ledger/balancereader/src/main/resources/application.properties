server.port = ${PORT}
handlers = java.util.logging.ConsoleHandler
spring.main.banner-mode=off
# Tracing: OTLP (Kind) when MANAGEMENT_OTLP_TRACING_ENDPOINT is set; else Cloud Trace (GKE).
management.tracing.enabled=${ENABLE_TRACING:false}
management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=${MANAGEMENT_OTLP_TRACING_ENDPOINT:}
spring.cloud.gcp.trace.enabled=${ENABLE_TRACING:false}
spring.application.name=${OTEL_SERVICE_NAME:balancereader}
# Prometheus scrape at /actuator/prometheus (Kubernetes / Prometheus Operator).
# Independent of ENABLE_METRICS, which only toggles Stackdriver push to GCP.
management.endpoints.web.exposure.include=prometheus
#enables all tomcat metrics to be recorded
server.tomcat.mbeanregistry.enabled=true
#enables jpa metrics to be recorded
spring.jpa.properties.hibernate.generate_statistics=true
#set the jpa database platform
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
